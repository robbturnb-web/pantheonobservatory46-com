<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security headers (balanced defaults). Servers/CDN can override
         with stronger header-based versions; meta tags are the safe
         baseline that ships with the static bundle. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.gpteng.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.supabase.co https://*.lovable.app https://storage.googleapis.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.lovable.dev https://cdn.gpteng.co; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Pantheon Observatory — Cosmic intelligence & disclosure</title>
    <meta name="description" content="Pantheon Observatory: a living archive of UAP cases, whistleblower testimony, ancient mythology, and cosmic disclosure. Explore the signal." />
    <meta name="author" content="Pantheon Observatory" />
    <!-- Canonical handled per-route via react-helmet-async (src/components/SEO.tsx) -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Single combined font request (Space Grotesk + Space Mono + Bagel Fat One) preloaded for faster first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Cinzel:wght@500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Cinzel:wght@500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap">

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pantheon Observatory" />
    <meta property="og:title" content="Pantheon Observatory — Cosmic intelligence & disclosure" />
    <meta property="og:description" content="A living archive of UAP cases, whistleblower testimony, ancient mythology, and cosmic disclosure." />
    <meta property="og:url" content="https://pantheonobservatory46-com.lovable.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pantheon Observatory" />
    <meta name="twitter:description" content="A living archive of UAP cases, whistleblower testimony, ancient mythology, and cosmic disclosure." />

    <!-- Sitewide identity + Google sitelinks searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pantheon Observatory",
      "alternateName": "Pantheon Frequency 46",
      "url": "https://pantheonobservatory46-com.lovable.app/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://pantheonobservatory46-com.lovable.app/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pantheon Observatory",
      "url": "https://pantheonobservatory46-com.lovable.app/",
      "description": "Cosmic intelligence, disclosure, and the unexplained — a curated archive."
    }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
