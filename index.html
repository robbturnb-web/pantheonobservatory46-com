<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security headers (balanced defaults). Servers/CDN can override
         with stronger header-based versions; meta tags are the safe
         baseline that ships with the static bundle. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.gpteng.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.supabase.co https://*.lovable.app https://storage.googleapis.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://player.vimeo.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.lovable.dev https://cdn.gpteng.co https://earthquake.usgs.gov https://services.swpc.noaa.gov https://api.nasa.gov https://api.wheretheiss.at https://api.weather.gov https://api.open-meteo.com https://marine-api.open-meteo.com https://api.farmsense.net; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Pantheon Observatory 46 — Evidence-Led Cosmic Research</title>
    <meta name="description" content="Evidence-led research into UAP cases, ancient mythology, consciousness, and live solar weather — facts, theories, beliefs, and the unexplained, clearly separated. Frequency 46." />
    <meta name="author" content="Pantheon Observatory" />
    <!-- Canonical handled per-route via react-helmet-async (src/components/SEO.tsx) -->

    <!-- PWA · installable home-screen app (no service worker; offline disabled) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#7C3AED" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pantheon 46" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Single combined font request (Space Grotesk + Space Mono + Bagel Fat One) preloaded for faster first paint -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Cinzel:wght@500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Cinzel:wght@500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap">

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pantheon Observatory" />
    <meta property="og:title" content="Pantheon Observatory · Frequency 46" />
    <meta property="og:description" content="Evidence-led research into UAP cases, ancient mythology, consciousness, and live space weather — every entry labelled fact, theory, belief, or unexplained, with sources." />
    <meta property="og:url" content="https://pantheonobservatory46.com/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pantheon Observatory · Frequency 46" />
    <meta name="twitter:description" content="Evidence-led research into UAP, mythology, consciousness, and the cosmos — facts, theories, beliefs, and the unexplained, clearly separated." />

    <!-- Sitewide identity + Google sitelinks searchbox -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Pantheon Observatory",
      "alternateName": "Pantheon Frequency 46",
      "url": "https://pantheonobservatory46.com/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://pantheonobservatory46.com/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Pantheon Observatory",
      "url": "https://pantheonobservatory46.com/",
      "description": "Evidence-led research into cosmic intelligence, disclosure, and the unexplained — facts, theories, beliefs, and open questions kept clearly separate."
    }
    </script>

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
