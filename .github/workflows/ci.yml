name: Pantheon Observatory CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, lint, and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun for the sitemap build script
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build production site
        run: bun run build

      - name: Run ESLint
        run: bun run lint

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Test Galaxy Explorer on desktop and mobile
        run: bunx playwright test --config=playwright.ci.config.ts
