name: Visual Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      routes:
        description: "Comma-separated routes to test (e.g. /,/profile). Leave blank for all."
        required: false
        default: ""

jobs:
  playwright:
    name: Playwright (Codex active state)
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: pw-${{ runner.os }}-

      - name: Install Playwright (browsers + OS deps)
        run: bunx playwright install --with-deps chromium

      - name: Run visual regression
        run: bunx playwright test
        env:
          CI: "true"
          VISUAL_ROUTES: ${{ github.event.inputs.routes }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14
